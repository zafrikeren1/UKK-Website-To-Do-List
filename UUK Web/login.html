
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Todoly</title>

    <!-- Google Font: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="cssuuk.css">
</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                <span>✦</span>
            </div>

            <h1>Welcome to Todoly!</h1>

            <p class="login-subtitle">
                A little progress each day adds up to big results.
            </p>

            <form id="login-form">

                <div class="login-input-group">
                    <label for="login-name">Your Name</label>

                    <input
                        type="text"
                        id="login-name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="login-input-group">
                    <label for="login-email">Your Email</label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Get Started
                </button>

            </form>

            <p class="login-footer">
                Make today count. One task at a time.
            </p>

        </div>

    </main>

    <script src="tsuuk.js"></script>

</body>
</html>
